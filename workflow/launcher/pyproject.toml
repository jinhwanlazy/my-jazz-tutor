version = "0.1.4"
description = "uv launcher for the installed My Jazz Tutor runtime"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
jazz = "jazz_practice:main"

[build-system]
requires = ["uv_build==0.9.27"]
